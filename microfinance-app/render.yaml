services:
  - type: web
    name: microfinance-app
    env: docker
    dockerfilePath: Dockerfile
    buildCommand: |
      docker build --build-arg DATABASE_URL=$DATABASE_URL -t microfinance-app .
    startCommand: docker run -p 3001:3001 microfinance-app
    envVars:
      - key: DATABASE_URL
        sync: false
