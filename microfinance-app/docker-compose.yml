services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: ${DATABASE_URL}
    image: chit-fund-app:latest
    container_name: microfinance-app
    ports:
      - "3001:3001"  # Maps host port 3001 to container port 3001
    env_file:
      - .env
    environment:
      # Override specific variables if needed
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:password@db:5432/postgres?schema=public
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:latest
    container_name: am-fincorp
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
